name: build

on:
  push:
  pull_request:

jobs:
  assembleDebug:
    name: assembleDebug (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [stub, whisper]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Checkout whisper.cpp (engine job)
        if: matrix.engine == 'whisper'
        run: git clone --depth 1 https://github.com/ggerganov/whisper.cpp slide-dictate/app/src/main/cpp/whisper.cpp

      - name: Gradle wrapper
        run: cd slide-dictate && gradle wrapper --gradle-version 8.7

      - name: Build
        run: cd slide-dictate && ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ matrix.engine }}
          path: slide-dictate/app/build/outputs/apk/debug/app-debug.apk
