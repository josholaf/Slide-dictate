name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slide-dictate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners already ship the Android SDK; use the provisioned Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: slide-dictate-apks
          path: |
            slide-dictate/app/build/outputs/apk/debug/*.apk
            slide-dictate/app/build/outputs/apk/release/*.apk

      - name: Attach APKs to tag release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slide-dictate/app/build/outputs/apk/debug/app-debug.apk
            slide-dictate/app/build/outputs/apk/release/app-release.apk

      - name: Publish rolling latest release (main pushes)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Rolling build from main (${{ github.sha }}). Debug APK for testing; release APK is signed with the debug key unless the SLIDE_KEYSTORE* secrets are set.
          prerelease: true
          files: |
            slide-dictate/app/build/outputs/apk/debug/app-debug.apk
            slide-dictate/app/build/outputs/apk/release/app-release.apk
