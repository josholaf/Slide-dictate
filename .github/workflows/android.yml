name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slide-dictate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (none is checked in)
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: slide-dictate-apks
          path: |
            slide-dictate/app/build/outputs/apk/debug/*.apk
            slide-dictate/app/build/outputs/apk/release/*.apk

      - name: Attach APKs to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slide-dictate/app/build/outputs/apk/debug/app-debug.apk
            slide-dictate/app/build/outputs/apk/release/app-release.apk
